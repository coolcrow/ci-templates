name: fullstack-pipeline
# ============================================================
# 中央可复用流水线：测试 → 构建镜像(ghcr.io) → 触发 Dokploy 部署
# 各项目通过 workflow_call 引用本文件，禁止在项目内复制修改。
# 流水线逻辑变更只改这里，全部项目自动生效。
# ============================================================

on:
  workflow_call:
    inputs:
      project-name:
        description: "项目名，用于镜像命名 ghcr.io/<org>/<project-name>-(backend|frontend)"
        required: true
        type: string
      environment:
        description: "部署环境：staging | production"
        required: true
        type: string
      has-backend:
        description: "是否构建/测试后端"
        required: false
        type: boolean
        default: true
      has-frontend:
        description: "是否构建/测试前端"
        required: false
        type: boolean
        default: true
      backend-path:
        description: "后端目录（源码在仓库根目录的项目用 \".\"）"
        required: false
        type: string
        default: "backend"
      frontend-path:
        description: "前端目录"
        required: false
        type: string
        default: "frontend"
      deploy-webhook-url:
        description: "部署 webhook URL（通用回退方案）；与 dokploy-compose-id 二选一"
        required: false
        type: string
        default: ""
      dokploy-compose-id:
        description: "Dokploy Compose 服务 ID（自建服务器场景，直连 API 部署，优先于 webhook）"
        required: false
        type: string
        default: ""
      needs-mysql:
        description: "后端测试是否需要 MySQL 8.0 服务容器"
        required: false
        type: boolean
        default: false
      test-mysql-db:
        description: "测试 MySQL 库名"
        required: false
        type: string
        default: "app_test"
      test-mysql-password:
        description: "测试 MySQL root 密码"
        required: false
        type: string
        default: "test-pw"
      runner:
        description: "运行器标签。部署服务器在内网时项目需用 self-hosted"
        required: false
        type: string
        default: "ubuntu-latest"
      test-apt-packages:
        description: "测试容器需额外安装的 apt 包（空格分隔，如 libgl1；opencv 等原生依赖场景）"
        required: false
        type: string
        default: ""
      proxy:
        description: "self-hosted runner 访问 github 的代理（测试 job 容器内 checkout/pip 用；空=直连）"
        required: false
        type: string
        default: "http://192.168.31.98:7897"
    secrets:
      DEPLOY_WEBHOOK_TOKEN:
        description: "Dokploy webhook 鉴权 token（如面板启用鉴权）"
        required: false
      WECOM_WEBHOOK_URL:
        description: "企业微信群机器人 webhook（可选，推送部署结果）"
        required: false

env:
  REGISTRY: ghcr.io
  TEMPLATES_REPO: ${{ github.repository_owner }}/ci-templates

jobs:
  test-backend:
    name: 后端测试
    if: inputs.has-backend && !inputs.needs-mysql
    runs-on: ${{ inputs.runner }}
    container:
      image: python:3.12
    # workflow env 会以 -e 注入 job 容器——容器内 git/curl/pip 确定性走代理，
    # 不依赖 runner 的 HOME/gitconfig 拷贝机制（该机制时灵时不灵）
    env:
      HTTPS_PROXY: ${{ inputs.proxy }}
      HTTP_PROXY: ${{ inputs.proxy }}
      NO_PROXY: localhost,127.0.0.1,192.168.31.0/24
    steps:
      - uses: actions/checkout@v4

      - name: 安装额外系统依赖
        if: inputs.test-apt-packages != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ${{ inputs.test-apt-packages }}
          rm -rf /var/lib/apt/lists/*

      - name: 安装依赖并测试 (pytest)
        working-directory: ${{ inputs.backend-path }}
        env:
          # self-hosted（国内服务器）走清华镜像；GitHub 托管 runner 直连 pypi
          PIP_INDEX_URL: ${{ inputs.runner == 'self-hosted' && 'https://pypi.tuna.tsinghua.edu.cn/simple' || 'https://pypi.org/simple' }}
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install .
          fi
          pip install pytest pytest-asyncio httpx
          pytest

      - name: 归还工作区权限
        if: always()
        run: chmod -R a+rwX .

  test-backend-mysql:
    name: 后端测试（含 MySQL）
    if: inputs.has-backend && inputs.needs-mysql
    runs-on: ${{ inputs.runner }}
    container:
      image: python:3.12
    env:
      HTTPS_PROXY: ${{ inputs.proxy }}
      HTTP_PROXY: ${{ inputs.proxy }}
      NO_PROXY: localhost,127.0.0.1,192.168.31.0/24
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ inputs.test-mysql-password }}
          MYSQL_DATABASE: ${{ inputs.test-mysql-db }}
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p${{ inputs.test-mysql-password }} --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: 安装额外系统依赖
        if: inputs.test-apt-packages != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ${{ inputs.test-apt-packages }}
          rm -rf /var/lib/apt/lists/*

      - name: 安装依赖并测试 (pytest)
        working-directory: ${{ inputs.backend-path }}
        env:
          PIP_INDEX_URL: ${{ inputs.runner == 'self-hosted' && 'https://pypi.tuna.tsinghua.edu.cn/simple' || 'https://pypi.org/simple' }}
          # 容器 job 内通过服务名访问 MySQL；项目 conftest 需支持 TEST_DB_URL 环境变量覆盖
          TEST_DB_URL: mysql+aiomysql://root:${{ inputs.test-mysql-password }}@mysql:3306/${{ inputs.test-mysql-db }}?charset=utf8mb4
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install .
          fi
          pip install pytest pytest-asyncio httpx
          pytest

      - name: 归还工作区权限
        if: always()
        run: chmod -R a+rwX .

  test-frontend:
    name: 前端测试
    if: inputs.has-frontend
    runs-on: ${{ inputs.runner }}
    container:
      image: node:20
    env:
      HTTPS_PROXY: ${{ inputs.proxy }}
      HTTP_PROXY: ${{ inputs.proxy }}
      NO_PROXY: localhost,127.0.0.1,192.168.31.0/24
    steps:
      - uses: actions/checkout@v4

      - name: 测试与构建验证
        working-directory: ${{ inputs.frontend-path }}
        env:
          NPM_CONFIG_REGISTRY: ${{ inputs.runner == 'self-hosted' && 'https://registry.npmmirror.com' || 'https://registry.npmjs.org' }}
        run: |
          npm ci
          npm run test --if-present
          npm run build

      - name: 归还工作区权限
        if: always()
        run: chmod -R a+rwX .

  build-backend:
    name: 构建后端镜像
    needs: [test-backend, test-backend-mysql, test-frontend]
    if: always() && inputs.has-backend && !failure() && !cancelled()
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Dockerfile（项目可在 <backend-path>/Dockerfile 覆盖中央模板）
        run: |
          if [ ! -f "${{ inputs.backend-path }}/Dockerfile" ]; then
            curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${{ env.TEMPLATES_REPO }}/contents/docker/backend.Dockerfile" \
              -o "${{ inputs.backend-path }}/Dockerfile"
          fi

      - uses: docker/setup-buildx-action@v3
        if: inputs.runner == 'self-hosted'
        with:
          config-inline: |
            [registry."docker.io"]
              mirrors = ["docker.m.daocloud.io"]

      - uses: docker/setup-buildx-action@v3
        if: inputs.runner != 'self-hosted'

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.backend-path }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.project-name }}-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.project-name }}-backend:${{ inputs.environment }}-latest

      # ghcr.io 从国内拉取极慢（1.7GB 实测 ~1MB/min）甚至停滞；CI 与部署机同机时，
      # 构建后直接把镜像 load 进本机 daemon —— Dokploy 的 pull_policy:always 拉取时
      # 全部层 Already exists，部署从小时级降到秒级。第二次 build 命中本地缓存，代价仅镜像导出的时间。
      - name: 预热部署机本地镜像缓存
        if: inputs.runner == 'self-hosted'
        working-directory: ${{ inputs.backend-path }}
        run: >-
          docker buildx build --load --cache-from type=gha
          -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.project-name }}-backend:${{ inputs.environment }}-latest
          .

  build-frontend:
    name: 构建前端镜像
    needs: [test-backend, test-backend-mysql, test-frontend]
    if: always() && inputs.has-frontend && !failure() && !cancelled()
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Dockerfile 与 nginx 配置（项目可放 <frontend-path>/Dockerfile 覆盖）
        run: |
          if [ ! -f "${{ inputs.frontend-path }}/Dockerfile" ]; then
            curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${{ env.TEMPLATES_REPO }}/contents/docker/frontend.Dockerfile" \
              -o "${{ inputs.frontend-path }}/Dockerfile"
          fi
          if [ ! -f "${{ inputs.frontend-path }}/nginx.conf" ]; then
            curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${{ env.TEMPLATES_REPO }}/contents/docker/nginx.conf" \
              -o "${{ inputs.frontend-path }}/nginx.conf"
          fi

      - uses: docker/setup-buildx-action@v3
        if: inputs.runner == 'self-hosted'
        with:
          config-inline: |
            [registry."docker.io"]
              mirrors = ["docker.m.daocloud.io"]

      - uses: docker/setup-buildx-action@v3
        if: inputs.runner != 'self-hosted'

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.frontend-path }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.project-name }}-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.project-name }}-frontend:${{ inputs.environment }}-latest

      # 同 build-backend：预热本机 daemon，规避 ghcr.io 国内拉取停滞
      - name: 预热部署机本地镜像缓存
        if: inputs.runner == 'self-hosted'
        working-directory: ${{ inputs.frontend-path }}
        run: >-
          docker buildx build --load --cache-from type=gha
          -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.project-name }}-frontend:${{ inputs.environment }}-latest
          .

  deploy:
    name: 触发 Dokploy 部署
    needs: [build-backend, build-frontend]
    if: >-
      always() && (inputs.deploy-webhook-url != '' || inputs.dokploy-compose-id != '') &&
      (!inputs.has-backend || needs.build-backend.result == 'success') &&
      (!inputs.has-frontend || needs.build-frontend.result == 'success')
    runs-on: ${{ inputs.runner }}
    steps:
      - name: 调用 Dokploy API 部署
        if: inputs.dokploy-compose-id != ''
        run: |
          curl -fsSL -X POST "${{ vars.DOKPLOY_API_URL }}/api/compose.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"composeId": "${{ inputs.dokploy-compose-id }}"}'

      - name: 调用部署 webhook（回退）
        if: inputs.dokploy-compose-id == '' && inputs.deploy-webhook-url != ''
        run: |
          curl -fsSL -X POST "${{ inputs.deploy-webhook-url }}"

      - name: 企业微信通知（可选）
        if: always()
        env:
          WECOM_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: |
          [ -z "$WECOM_URL" ] && exit 0
          RESULT=$([ "${{ job.status }}" = "success" ] && echo "成功" || echo "失败")
          curl -fsSL -X POST "$WECOM_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"[${{ inputs.project-name }}] ${{ inputs.environment }} 部署${RESULT} @ ${{ github.sha }}\"}}"
